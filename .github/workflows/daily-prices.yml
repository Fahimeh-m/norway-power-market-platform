name: Daily price fetch
on:
  schedule:
    - cron: "17 6 * * *"
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: pip install requests azure-storage-blob pytest
      - run: python fetch_prices.py
      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw
          git diff --cached --quiet || git commit -m "Add daily prices"
          git push
      - name: Check the raw files
        run: pytest
      - name: Upload raw files to Azure
        env:
          AZURE_STORAGE_SAS_TOKEN: ${{ secrets.AZURE_STORAGE_SAS_TOKEN }}
        run: python upload_to_azure.py
